[package]
name = "cerbo"


version = "0.1.0"
edition = "2024"

[dependencies]
cerbo-core = { path = "../core", features = ["embeddings"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "3.11", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"

[target.'cfg(unix)'.dependencies]
# Ends a daemon that speaks another protocol version (SIGTERM).
libc = "0.2"

[dev-dependencies]
cerbo-core = { path = "../core", features = ["test-utils"] }
# A daemon running inside the test process, for the daemon and MCP tests.
cerboid = { path = "../cerboid" }
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
# Opens a pseudo-terminal for the interactive import-vault test.
libc = "0.2"

[build-dependencies]
