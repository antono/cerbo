[package]
name = "cerbo-core"


version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
unicode-normalization = "0.1"
chrono = "0.4"
xdg = "3"
tempfile = "3"
oxttl = "=0.2.5"
oxrdf = "=0.3.5"
oxigraph = "0.5"
regex = "1"
slug-lib = { package = "slug", version = "0.1" }
pathdiff = "0.2"
# Local text embeddings (semantic search). ONNX Runtime is loaded at run time
# from ORT_DYLIB_PATH, so nothing is downloaded at build time.
fastembed = { version = "7.5", default-features = false, features = ["ort-load-dynamic"], optional = true }
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
# Index directory key (always) and model checksums (embeddings).
sha2 = "0.10"

[features]
test-utils = []
embeddings = ["dep:fastembed", "dep:ureq"]

[dev-dependencies]
tempfile = "3"
