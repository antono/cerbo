[package]
name = "cerbo-core"


version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
unicode-normalization = "0.1"
chrono = "0.4"
xdg = "3"
tempfile = "3"
oxttl = "=0.2.5"
oxrdf = "=0.3.5"
regex = "1"
slug-lib = { package = "slug", version = "0.1" }
pathdiff = "0.2"

[features]
test-utils = []

[dev-dependencies]
tempfile = "3"
