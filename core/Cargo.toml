[package]
name = "cerbo-core"


version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
notify = "6"
unicode-normalization = "0.1"
chrono = "0.4"
xdg = "2"
tempfile = "3"
oxttl = "=0.2.4"
oxrdf = "=0.3.4"
regex = "1"
reqwest = { version = "0.11", features = ["blocking"] }
slug-lib = { package = "slug", version = "0.1" }
pathdiff = "0.2"

[features]
test-utils = []

[dev-dependencies]
tempfile = "3"
