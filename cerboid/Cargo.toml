[package]
name = "cerboid"
version = "0.1.0"
edition = "2024"
description = "The Cerbo daemon: one owner of every vault per user"

[lib]
name = "cerboid"
path = "src/lib.rs"

[[bin]]
name = "cerboid"
path = "src/main.rs"

[dependencies]
cerbo-core = { path = "../core", features = ["embeddings"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
notify = "8"
uuid = "1"
similar = "2"

[dev-dependencies]
cerbo-core = { path = "../core", features = ["test-utils"] }
tempfile = "3"
